{% extends 'base.html' %}

{% block title %}404 - Halaman Tidak Ditemukan{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-12 col-md-8 col-lg-6 text-center">
        <div class="display-1 fw-bold text-warning mb-3"><i class="bi bi-question-circle"></i> 404</div>
        <h3 class="fw-bold mb-2">Halaman Tidak Ditemukan</h3>
        <p class="text-muted mb-4">
            Alamat URL atau data yang Anda tuju tidak tersedia atau telah dipindahkan.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'reports:dashboard' %}" class="btn btn-primary">
                <i class="bi bi-house-door me-1"></i>Kembali ke Dashboard
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Halaman Sebelumnya
            </a>
        </div>
    </div>
</div>
{% endblock %}
