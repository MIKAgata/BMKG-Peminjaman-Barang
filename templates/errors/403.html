{% extends 'base.html' %}

{% block title %}403 - Akses Ditolak{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-12 col-md-8 col-lg-6 text-center">
        <div class="display-1 fw-bold text-danger mb-3"><i class="bi bi-shield-slash"></i> 403</div>
        <h3 class="fw-bold mb-2">Akses Ditolak (Forbidden)</h3>
        <p class="text-muted mb-4">
            Mohon maaf, Anda tidak memiliki hak akses atau izin yang memadai untuk membuka halaman ini.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'reports:dashboard' %}" class="btn btn-primary">
                <i class="bi bi-house-door me-1"></i>Kembali ke Dashboard
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Halaman Sebelumnya
            </a>
        </div>
    </div>
</div>
{% endblock %}
